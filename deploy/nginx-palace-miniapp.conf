# Telegram Mini Apps must be served over HTTPS.
# 1. Point a domain (e.g. adms.example.com) to the server.
# 2. Copy this file to /etc/nginx/sites-available/, enable it, then run:
#      certbot --nginx -d adms.example.com
# 3. Set WEBAPP_URL=https://adms.example.com in /opt/palace-adms/.env and restart palace-bot.

server {
    listen 80;
    server_name adms.example.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
