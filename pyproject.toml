[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palace-adms-bot"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]==22.8",
    "httpx>=0.27,<0.29",
    "python-dotenv==1.0.1",
]

[project.scripts]
palace-bot = "bot.main:main"
